<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আমার সংগ্রহ</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14222b;--mute:#5b6b76;--line:#d8e0e5;--brand:#0b6b78;--brand-ink:#fff;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e171c;--card:#16232a;--ink:#e8eff2;--mute:#9bb0ba;--line:#26373f;--brand:#3fb7c6;--brand-ink:#08181c;--warn:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:1.2rem;margin:0}
main{max-width:960px;margin:0 auto;padding:20px}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 12px}
label{font-size:.9rem;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:420px;margin:40px auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item img{width:100%;height:170px;object-fit:cover;display:block;background:var(--line)}
.item div{padding:12px 14px}
.item h3{margin:0 0 4px;font-size:1.05rem}
.item p{margin:0 0 10px;color:var(--mute);white-space:pre-wrap}
.msg{min-height:1.4em;font-size:.9rem;color:var(--warn)}
.msg.ok{color:var(--brand)}
.hidden{display:none}
.tabs{display:flex;gap:8px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>আমার সংগ্রহ</h1>
  <div id="bar" class="hidden"><span id="who"></span> <button class="ghost" id="logout">লগ আউট</button></div>
</header>

<main>
  <!-- লগইন -->
  <section id="auth" class="box hidden">
    <div class="tabs">
      <button id="tabIn">লগ ইন</button>
      <button class="ghost" id="tabUp">নতুন অ্যাকাউন্ট</button>
    </div>
    <label for="email">ইমেইল</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pass">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button id="go">লগ ইন করুন</button>
    <p class="msg" id="authMsg"></p>
  </section>

  <!-- অ্যাডমিন প্যানেল -->
  <section id="admin" class="panel hidden">
    <h2 style="margin-top:0">অ্যাডমিন প্যানেল</h2>
    <label for="t">শিরোনাম</label>
    <input id="t">
    <label for="d">বিবরণ</label>
    <textarea id="d" rows="3"></textarea>
    <label for="f">ছবি</label>
    <input id="f" type="file" accept="image/*">
    <button id="save">সংরক্ষণ করুন</button>
    <p class="msg" id="adminMsg"></p>
  </section>

  <!-- তালিকা -->
  <section id="list" class="hidden">
    <div class="grid" id="grid"></div>
    <p id="empty" class="msg ok hidden">এখনো কিছু যোগ করা হয়নি।</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== শুধু এই দুই লাইন বদলান (Supabase > Project Settings > API) ======
const SUPABASE_URL = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlcGh1c3ZwdXF4aGVzeW1zZWtvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5NTUzMzg5OCwiZXhwIjoyMTExMTA5ODk4fQ.7lj9qEggLNZdWW6tPVS1hMBv2dbqBwj7UAhMEJKqMCI";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlcGh1c3ZwdXF4aGVzeW1zZWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzM4OTgsImV4cCI6MjExMTEwOTg5OH0.E4nI1OXsGyNBF7wtn6w_pThWvMK-80oW1SsIXzxe2UQ";
// =========================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let mode = "in", isAdmin = false;

function show(id, on){ $(id).classList.toggle("hidden", !on); }
function say(id, text, ok){ $(id).textContent = text; $(id).classList.toggle("ok", !!ok); }

$("tabIn").onclick = () => setMode("in");
$("tabUp").onclick = () => setMode("up");
function setMode(m){
  mode = m;
  $("tabIn").className = m === "in" ? "" : "ghost";
  $("tabUp").className = m === "up" ? "" : "ghost";
  $("go").textContent = m === "in" ? "লগ ইন করুন" : "অ্যাকাউন্ট খুলুন";
  say("authMsg", "");
}

$("go").onclick = async () => {
  const email = $("email").value.trim(), password = $("pass").value;
  if(!email || password.length < 6){ say("authMsg", "সঠিক ইমেইল ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।"); return; }
  say("authMsg", "অপেক্ষা করুন…", true);
  const fn = mode === "in" ? sb.auth.signInWithPassword : sb.auth.signUp;
  const { error } = await fn.call(sb.auth, { email, password });
  if(error){ say("authMsg", error.message); return; }
  if(mode === "up") say("authMsg", "আপনার ইমেইলে পাঠানো লিংকে ক্লিক করে নিশ্চিত করুন, তারপর লগ ইন করুন।", true);
};

$("logout").onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_e, session) => render(session));
sb.auth.getSession().then(({ data }) => render(data.session));

async function render(session){
  show("auth", !session); show("bar", !!session); show("list", !!session);
  if(!session){ show("admin", false); isAdmin = false; return; }
  $("who").textContent = session.user.email;
  const { data } = await sb.from("admins").select("email").limit(1);
  isAdmin = !!(data && data.length);
  show("admin", isAdmin);
  loadItems();
}

async function loadItems(){
  const { data, error } = await sb.from("items").select("*").order("created_at", { ascending:false });
  const grid = $("grid"); grid.replaceChildren();
  if(error){ return; }
  show("empty", data.length === 0);
  data.forEach(it => {
    const card = document.createElement("article"); card.className = "item";
    if(it.image_url){ const img = document.createElement("img"); img.src = it.image_url; img.alt = it.title; card.append(img); }
    const body = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = it.title;
    const p = document.createElement("p"); p.textContent = it.details || "";
    body.append(h, p);
    if(isAdmin){
      const del = document.createElement("button"); del.className = "danger"; del.textContent = "মুছুন";
      del.onclick = async () => {
        if(!confirm("এটি মুছে ফেলবেন?")) return;
        await sb.from("items").delete().eq("id", it.id);
        loadItems();
      };
      body.append(del);
    }
    card.append(body); grid.append(card);
  });
}

$("save").onclick = async () => {
  const title = $("t").value.trim();
  if(!title){ say("adminMsg", "শিরোনাম দিন।"); return; }
  say("adminMsg", "সংরক্ষণ হচ্ছে…", true);
  let image_url = null;
  const file = $("f").files[0];
  if(file){
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
    const up = await sb.storage.from("images").upload(path, file);
    if(up.error){ say("adminMsg", up.error.message); return; }
    image_url = sb.storage.from("images").getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from("items").insert({ title, details: $("d").value.trim(), image_url });
  if(error){ say("adminMsg", error.message); return; }
  $("t").value = ""; $("d").value = ""; $("f").value = "";
  say("adminMsg", "সংরক্ষণ হয়েছে।", true);
  loadItems();
};
</script>
</body>
</html>
